services:
  api:
    build: .
    image: regulation-audit-api:latest
    container_name: regulation-audit-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/regulations.db
    volumes:
      - regulation-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3; sqlite3.connect(os.environ['DB_PATH']).execute('SELECT 1')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  regulation-data:
